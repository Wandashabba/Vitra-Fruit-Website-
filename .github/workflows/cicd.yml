name: Vitra Fruit CI

on:
  push:
    branches:
      - dev
      - uat
      - prod

  pull_request:
    branches:
      - dev
      - uat

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build application
        run: npm run build

  Dev:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --g vercel@latest

      - name: Deploy to Dev
        run: vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --env=dev

  UAT:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/uat'

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install Vercel CLI
        run: npm install --g vercel@latest

      - name: Deploy to UAT
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --env=uat

  Prod:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod'

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install Vercel CLI
        run: npm install --g vercel@latest

      - name: Pull Vercel Production Config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Prod
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --env=prod

